<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV spectator layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5b8cff}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; display: flex; background: #000000; color: #eef2f7; font-family: Roboto, system-ui, sans-serif;">

<div style="width: 720px; height: 540px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #1c2534;">
<span style="font-size: 16px; line-height: 22px; color: #9aa6b8;">Participant view — 4:3, full height</span>
</div>

<div style="width: 240px; height: 540px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; background: #131a26; border-left: 1px solid #2e3a4e;">
<span style="font-size: 27px; line-height: 32px; font-weight: 700; color: #5b8cff; white-space: nowrap;">MISSION 5 / 14</span>
<span style="margin-top: 12px; font-size: 24px; line-height: 28px; color: #eef2f7;">Get into the vehicle.</span>

<div style="flex-grow: 1;"></div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; line-height: 14px; letter-spacing: 0.08em; color: #9aa6b8;">PROGRESS</span>
<div style="height: 6px; border-radius: 2px; background: #1c2534; overflow: hidden;">
<div style="width: 28.6%; height: 6px; background: #5b8cff;"></div>
</div>
<span style="font-size: 13px; line-height: 16px; color: #9aa6b8;">4 of 14 complete</span>
</div>

<div style="margin-top: 16px; height: 1px; background: #2e3a4e;"></div>

<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; line-height: 14px; letter-spacing: 0.08em; color: #9aa6b8;">INTERACTING</span>
<span style="font-size: 18px; line-height: 22px; color: #eef2f7;">Driver Door</span>
<span style="font-size: 18px; line-height: 22px; color: #eef2f7;">Gear Lever</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
